#:schema https://panache.bz/panache.schema.json
flavor = "gfm"
extend-exclude = ["docs/src/*/dependents.md", "docs/src/es/", "tests/fixtures/"]  # bot-generated (dependents, translations)

[format]
wrap = "preserve"
smart-punctuation = "preserve" # docs quote literal argument values
tab-stops = "preserve"
